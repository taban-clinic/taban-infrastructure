# shellcheck shell=bash disable=SC2034
# dr-yousefi.ir. Sourced by deploy/lib/common.sh. Non-secret settings only.
UNIT=dr-yousefi-site
PORT=7332
# Env files live in ~/apps/dr-yousefi-site/shared/ and are linked into each release.
ENV_FILES=(.env)
HEALTH_PATHS=(/)
KEEP_RELEASES=5
# Note: SQLITE_PATH in .env points at /var/lib/dr-yousefi-site/data.sqlite, outside
# the release tree, so deploys and rollbacks never touch the database.
