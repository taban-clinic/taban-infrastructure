# shellcheck shell=bash disable=SC2034,SC2154
# Sourced by services/lib/common.sh; $REPO and $SERVICES_LIVE_ROOT are set by then.
PROJECT=supabase
LIVE_DIR="$SERVICES_LIVE_ROOT/supabase-infra"
# The base file stays in the live dir (upstream supabase self-host compose with pinned
# image tags); only the override is ours.
COMPOSE_FILES=("$LIVE_DIR/docker-compose.yml" "$REPO/services/supabase/docker-compose.override.yml")
# Only what actually runs here. realtime, storage, imgproxy, functions and supavisor are
# defined upstream but not deployed, and must never be started by an apply.
SERVICES=(db auth rest meta studio api-gw)
REQUIRE_FILES=(.env docker-compose.yml)
# Envoy answers 401 without an API key, which still proves it is up.
HTTP_CHECKS=(http://127.0.0.1:58000/)
