# shellcheck shell=bash disable=SC2034,SC2154
# Sourced by services/lib/common.sh; $REPO and $SERVICES_LIVE_ROOT are set by then.
PROJECT=umami-infra
LIVE_DIR="$SERVICES_LIVE_ROOT/umami-infra"
COMPOSE_FILES=("$REPO/services/umami/docker-compose.yml")
SERVICES=(umami-db umami)
# The real secrets (see .env.example) live only here, next to the live project.
REQUIRE_FILES=(.env)
HTTP_CHECKS=(http://127.0.0.1:58001/)
